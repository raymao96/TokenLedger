# Release: push a v* tag to build, sign, and publish macOS, Windows, and Linux
# artifacts whose latest.json feeds the in-app updater (endpoint:
# releases/latest/download/latest.json — see src-tauri/tauri.conf.json).
#
# The release is created as a draft, filled by the three build jobs, and
# published only once all three have succeeded. That order is load-bearing:
# `releases/latest` resolves to the newest *published* release, so an app
# checking for updates mid-run keeps being served the previous manifest rather
# than this one with only some platforms in it. A leg that fails leaves the
# draft unpublished instead of shipping a release nobody can update from.
#
# The bundle targets live in src-tauri/tauri.conf.json, which takes no comments,
# so the one non-obvious entry is explained here: "app" sits beside "dmg" because
# the macOS updater artifact (.app.tar.gz + .sig) is produced only when "app" is
# among the *requested* targets. Building just the DMG is silently updater-less —
# verified locally: the bundler warns "no updater-enabled targets were built" and
# emits nothing for the updater to serve. Targets that do not apply to the host
# are skipped without error, so one list serves all three legs.
#
# Configure repository secrets TAURI_PRIVATE_KEY and TAURI_KEY_PASSWORD
# with the updater signing private key and its password.
#
# Fork releases use vMAJOR.MINOR.PATCH.REVISION. For fork-only changes,
# increment REVISION by one and keep the app's three-part upstream version.
# After merging a newer upstream release, use its version and start at .1.
# Tag the exact main commit, then push that tag to start the release workflow.
# A manual run on main verifies installer names in a separate draft release.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Four-part version to use in the draft build, e.g. v0.4.5.2'
        required: true
        type: string

jobs:
  create-release:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.result }}
      build_tag: ${{ steps.draft.outputs.tag }}
      release_version: ${{ steps.version.outputs.number }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            node .github/scripts/check-release-version.mjs "$RELEASE_TAG" --preview
          else
            node .github/scripts/check-release-version.mjs "$RELEASE_TAG"
          fi
          printf 'number=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      # The install notes lead; GitHub appends the generated changelog under
      # them, so the SmartScreen click-through and the WSL and tray caveats are
      # on the page the download button is on.
      - uses: actions/github-script@v7
        id: draft
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
        with:
          result-encoding: string
          script: |
            const fs = require('fs');
            const preview = context.eventName === 'workflow_dispatch';
            const version = `v${process.env.RELEASE_VERSION}`;
            const tag = preview ? `build-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}` : version;
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: preview ? `TokenLedger ${version} build preview (${context.runId})` : `TokenLedger ${version}`,
              body: fs.readFileSync('.github/RELEASE_NOTES.md', 'utf8'),
              generate_release_notes: !preview,
              draft: true,
              prerelease: false,
            });
            core.setOutput('tag', tag);
            core.notice(data.html_url);
            return data.id;

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      # One platform failing must not cancel the others: the draft is easier to
      # finish by re-running one leg than by rebuilding all three.
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ci.yml's list plus patchelf, which linuxdeploy uses to rewrite rpaths on
      # the libraries it copies into the AppImage. No libfuse2: the bundler runs
      # linuxdeploy with --appimage-extract-and-run, so nothing is ever mounted.
      - if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - run: npm ci

      # Uploads into the draft this run created, rather than making its own
      # release per leg. releaseId is what selects it; tagName names the tag the
      # release is for.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: ${{ needs.create-release.outputs.build_tag }}
          releaseAssetNamePattern: '[name]_${{ needs.create-release.outputs.release_version }}_[arch][setup][ext]'
          # Covers a build or an upload that fails outright. It does NOT cover
          # the latest.json merge race, which loses an entry without erroring —
          # publish-release reads the manifest back for that.
          retryAttempts: 3

  publish-release:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Read latest.json back before publishing anything. Each leg rewrites this
      # one file, re-reading it first to keep the other platforms' entries, so
      # two legs finishing together can drop one — and that loss is silent:
      # nothing throws, the leg goes green, and the missing platform simply
      # stops being offered updates. Checking here turns it into a failed job
      # with the draft still unpublished, so the live endpoint keeps serving the
      # previous release until a re-run fixes it.
      - name: Verify build assets
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.create-release.outputs.release_version }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = ${{ needs.create-release.outputs.release_id }};
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner, repo, release_id, per_page: 100,
            });
            const names = assets.map(({ name }) => name).filter(name => name !== 'latest.json').sort();
            const misplaced = names.filter(name => !name.includes(`_${process.env.RELEASE_VERSION}_`));
            if (misplaced.length) throw new Error(`Incorrect version in asset name: ${misplaced.join(', ')}`);
            const missingInstallers = ['.dmg', '.AppImage', '-setup.exe'].filter(ext => !names.some(name => name.endsWith(ext)));
            if (missingInstallers.length) throw new Error(`Missing installers: ${missingInstallers.join(', ')}`);
            await core.summary.addHeading('Build assets').addList(names).write();
            if (context.eventName === 'workflow_dispatch') return;
            const asset = assets.find((a) => a.name === 'latest.json');
            if (!asset) throw new Error('no latest.json on the release — no leg uploaded one');
            const res = await github.request(
              'GET /repos/{owner}/{repo}/releases/assets/{asset_id}',
              { owner, repo, asset_id: asset.id, headers: { accept: 'application/octet-stream' } },
            );
            const platforms = Object.keys(JSON.parse(Buffer.from(res.data).toString()).platforms || {});
            const missing = ['darwin', 'windows', 'linux'].filter(
              (os) => !platforms.some((p) => p.startsWith(os)),
            );
            if (missing.length) {
              throw new Error(
                `latest.json is missing ${missing.join(', ')} (has: ${platforms.join(', ') || 'nothing'}). ` +
                'Re-run that platform\'s build job, then re-run this one.',
              );
            }
            core.info(`latest.json covers ${platforms.join(', ')}`);

      - if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false,
            });
